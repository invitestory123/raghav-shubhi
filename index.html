    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />

    <meta
      property="og:description"
      content="Join us for the wedding celebrations of Raghav &amp; Shubhi at Ananta Resorts &amp; Spa, Pushkar from 3rd to 5th December 2026."
    />
    <meta property="og:image" content="./editable/assets/couple.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raghav ♡ Shubhi — Wedding Invitation" />
    <meta
      name="twitter:description"
      content="Join us for the wedding celebrations of Raghav &amp; Shubhi at Ananta Resorts &amp; Spa, Pushkar from 3rd to 5th December 2026."
    />
    <meta name="twitter:image" content="./editable/assets/couple.png" />

    <!-- Local & Google Fonts -->
    <link rel="stylesheet" href="./external/fonts.googleapis.com/css2-afefae8748.css" />

    <script src="./editable/wedding-data.js"></script>
    <script type="module" crossorigin src="./assets/index-D-DATC24.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/styles-BZkC9aYC.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Music Audio -->
    <audio id="weddingBgAudio" loop preload="auto" playsinline>
      <source src="./editable/assets/bgm.mp3" type="audio/mpeg" />
    </audio>

    <script>
      (function () {
        var audio = document.getElementById("weddingBgAudio");
        if (!audio) return;

        var bgmConfig = (window.WEDDING_DATA && window.WEDDING_DATA.bgm) || {};
        if (bgmConfig.src) {
          audio.src = bgmConfig.src;
        }
        if (typeof bgmConfig.volume === "number") {
          audio.volume = bgmConfig.volume;
        } else {
          audio.volume = 0.8;
        }

        var hasInteracted = false;

        function findGramophoneBtn() {
          return (
            document.querySelector('button[aria-label*="music"]') ||
            document.querySelector('img[src*="gramophone"]')?.closest("button")
          );
        }

        function unlockAudio() {
          if (hasInteracted) return;
          hasInteracted = true;
          cleanupListeners();

          var btn = findGramophoneBtn();
          if (btn) {
            btn.click();
          } else if (audio.paused) {
            audio.play().catch(function () {});
          }
        }

        function cleanupListeners() {
          window.removeEventListener("click", unlockAudio, true);
          window.removeEventListener("touchstart", unlockAudio, true);
          window.removeEventListener("scroll", unlockAudio, true);
          window.removeEventListener("keydown", unlockAudio, true);
        }

        window.addEventListener("click", unlockAudio, true);
        window.addEventListener("touchstart", unlockAudio, true);
        window.addEventListener("scroll", unlockAudio, true);
        window.addEventListener("keydown", unlockAudio, true);

        // Attempt initial autoplay
        var promise = audio.play();
        if (promise !== undefined) {
          promise.catch(function () {});
        }
      })();
    </script>
  </body>
</html>
